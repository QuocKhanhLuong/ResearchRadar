[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-radar"
version = "0.1.0"
description = "Private, single-user autonomous research assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "APScheduler>=3.10,<4",
    "discord.py>=2.4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyMuPDF>=1.24",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
research-radar = "research_radar.main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".agenteam", ".codex"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

